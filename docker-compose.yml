services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: knowvault-postgres

    environment:
      POSTGRES_USER: knowvault
      POSTGRES_PASSWORD: knowvault123
      POSTGRES_DB: knowvault

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: